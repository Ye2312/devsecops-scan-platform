---
- name: Install git
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check out the application
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_version }}"
  register: app_checkout

# force: false keeps the password from the first run; regenerating it would lock the API
# out of the existing database volume.
- name: Generate the database password on first deploy
  ansible.builtin.copy:
    dest: "{{ app_dir }}/.env"
    content: "POSTGRES_PASSWORD={{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}\n"
    owner: root
    group: root
    mode: "0600"
    force: false
  no_log: true

- name: List the running services
  ansible.builtin.command:
    cmd: docker compose --project-name {{ app_project_name }} ps --status running --services
    chdir: "{{ app_dir }}"
  register: app_running
  changed_when: false

# Every `up` restarts the exited one-off migrate job, and Compose 2.x then restarts api as well,
# so the stack is only brought up when the code changed or a long-running service is down.
- name: Build and start the stack
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    project_name: "{{ app_project_name }}"
    # Rebuild only when the checkout moved; otherwise build just what is missing.
    build: "{{ 'always' if app_checkout.changed else 'policy' }}"
    remove_orphans: true
    state: present
  when: app_checkout.changed or (app_services | difference(app_running.stdout_lines) | length > 0)

- name: Wait until the API is ready
  ansible.builtin.uri:
    url: "{{ app_readyz_url }}"
    status_code: 200
  register: app_readyz
  until: app_readyz.status == 200
  retries: 30
  delay: 5
