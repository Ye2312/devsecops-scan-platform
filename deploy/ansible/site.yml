---
# Turns a fresh Ubuntu 24.04 host into a running scanner:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventories/example.ini site.yml
- name: Deploy devsecops-scan-platform
  hosts: scanner
  become: true
  # service_mgr reports systemd whenever it is installed, even in a container where it is not
  # running; services can only be managed when /run/systemd/system exists.
  pre_tasks:
    - name: Check whether systemd is running
      ansible.builtin.stat:
        path: /run/systemd/system
      register: systemd_runtime
      tags: [always]
  roles:
    - role: hardening
      tags: [hardening]
    - role: docker
      tags: [docker]
    - role: app
      tags: [app]
